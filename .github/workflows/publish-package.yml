name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Aube
        uses: jdx/aube-action@v1
        with:
          version: 1.25.1
          node-version: "22"

      - name: Install dependencies
        run: aube install --frozen-lockfile

      - name: Typecheck
        run: aube run typecheck

      - name: Build
        run: aube run build

      - name: Publish to npm
        working-directory: packages/barkdown
        run: aube publish --provenance --access public --no-git-checks
